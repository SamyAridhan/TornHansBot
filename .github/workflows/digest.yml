name: torn-digest

# One friendly morning message: stat gain, gains streak, 7-day trend, your
# bars, and a Hans line of the day. Reads the committed history.csv, so it's
# cheap.
#
# SCHEDULE DISABLED (2026-10-08): GitHub's cron is throttled on public repos
# and fired this hours late (arriving ~2pm instead of the morning). The daily
# digest is now sent by the always-on poller (torn_watch.py --loop) on a fixed
# local clock — see the "schedule" block in default_config(). This workflow is
# kept for manual sends only (workflow_dispatch / `python3 digest.py`).

on:
  workflow_dispatch: {}

concurrency:
  group: torn-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send daily digest
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ_OFFSET_HOURS: ${{ vars.TZ_OFFSET_HOURS }}
        run: python3 digest.py
