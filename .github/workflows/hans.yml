name: hans

# The whole bot in one job: alerts, landing buzz, depart alerts, OC reminders,
# digest/chart, pinned dashboard and the button menu.
#
# Uptime trick: each run lasts ~5h40m, a new run is requested hourly, and the
# concurrency guard queues it so it takes over the moment the current one ends.
# A push to the bot's code restarts it with the new version.

on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "hans/**"
      - ".github/workflows/hans.yml"

permissions:
  contents: write          # commit logs/*.csv back at the end of each run

concurrency:
  group: hans
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install chart library
        run: pip install --quiet matplotlib

      - name: Restore state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: hans_state.json
          key: hans-state-${{ github.run_id }}
          restore-keys: |
            hans-state-

      # One-time carry-over from the old two-bot setup (only if no new state yet).
      - name: Restore legacy poller state
        if: steps.state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            schedule_state.json
          key: torn-state-legacy-${{ github.run_id }}
          restore-keys: |
            torn-state-
      - name: Restore legacy command-bot state
        if: steps.state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            commands_state.json
            pin_state.json
            travel_state.json
            depart_watch.json
            flights.json
            oc_state.json
            cycles.json
          key: torn-cmd-legacy-${{ github.run_id }}
          restore-keys: |
            torn-cmd-

      - name: Run Hans (~5h40m)
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ_OFFSET_HOURS: ${{ vars.TZ_OFFSET_HOURS }}
          HANS_RUN_SECONDS: "20400"
        run: python3 -m hans run

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hans_state.json
          key: hans-state-${{ github.run_id }}

      - name: Save trip & restock logs to the repo
        if: always()
        run: |
          [ -d logs ] || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Merge, don't rebase: the next run may have checked out before the
          # previous run pushed, so both sides can add the same file. Keep the
          # latest repo copy and append only rows it doesn't have yet.
          rm -rf "$RUNNER_TEMP/newlogs" && cp -r logs "$RUNNER_TEMP/newlogs"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p logs
            for f in "$RUNNER_TEMP"/newlogs/*.csv; do
              t="logs/$(basename "$f")"
              if [ ! -s "$t" ]; then cp "$f" "$t"
              # same first 3 columns = same event (keeps hand-corrected rows as they are)
              else awk -F, 'NR==FNR{seen[$1 FS $2 FS $3]=1; next} FNR>1 && !seen[$1 FS $2 FS $3]' "$t" "$f" > "$RUNNER_TEMP/add.csv"; cat "$RUNNER_TEMP/add.csv" >> "$t"; fi
            done
            git add logs/*.csv
            git diff --cached --quiet && { echo "No new log rows."; exit 0; }
            git commit -q -m "chore(logs): trips & restocks $(date -u +%FT%TZ)"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "::warning::Could not push logs"
