name: torn-chart

# Weekly stat-growth chart: renders history.csv to a PNG and sends it to
# Telegram. Needs matplotlib.
#
# SCHEDULE DISABLED (2026-10-08): GitHub's cron is throttled on public repos
# and fired this at erratic times. The weekly chart is now sent by the
# always-on poller (torn_watch.py --loop) on a fixed local clock — see the
# "schedule" block in default_config(). This workflow is kept for manual sends
# only (workflow_dispatch / `python3 chart.py`).

on:
  workflow_dispatch: {}

concurrency:
  group: torn-chart
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install matplotlib
        run: pip install --quiet matplotlib

      - name: Render & send weekly chart
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 chart.py
