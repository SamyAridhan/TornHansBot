name: torn-watch

# Reliability: GitHub's cron is best-effort and sometimes SKIPS scheduled runs.
# A single skip used to leave a multi-hour gap (each run only lasted ~5h). Fix:
# runs now OVERLAP. Each run polls every 15 min for ~5.25h, and we ask the
# scheduler to start a new one every 2h. The concurrency guard makes a new run
# wait for the current one and take over the moment it ends, so even if GitHub
# skips a few crons, another fires within 2h and coverage stays continuous.
# A push that touches this file also starts a run (used to restart immediately).
# Public repo => unlimited Actions minutes, so the overlap is free.

on:
  schedule:
    - cron: "8 */2 * * *"     # try to (re)start every 2h; overlap tolerates skips
  workflow_dispatch: {}         # manual start
  push:
    paths:
      - ".github/workflows/poll.yml"   # editing this file restarts the watcher now

concurrency:
  group: torn-watch
  cancel-in-progress: false     # never kill a running loop; a new run waits, then takes over

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 340        # under GitHub's 6h hard cap
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: torn-state-${{ github.run_id }}
          restore-keys: |
            torn-state-

      - name: Poll every 15 min for ~5.25h
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Test mode: set repo VARIABLE ALERT_ON_INCREASE=1 to ping on every
          # energy/nerve increase; delete it for normal "full" alerts.
          ALERT_ON_INCREASE: ${{ vars.ALERT_ON_INCREASE }}
        run: |
          ITER=22
          for i in $(seq 1 $ITER); do
            echo "::group::poll $i/$ITER ($(date -u +%FT%TZ))"
            python3 torn_watch.py || echo "poll $i failed (continuing)"
            echo "::endgroup::"
            if [ "$i" -lt "$ITER" ]; then sleep 900; fi
          done

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: torn-state-${{ github.run_id }}
